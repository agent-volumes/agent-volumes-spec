# Lefthook pre-commit configuration
# Documentation: https://lefthook.dev/configuration/

commit-msg:
  commands:
    dco-signoff:
      run: |
        if ! grep -qE "^Signed-off-by: " "{1}"; then
          echo "❌ DCO sign-off missing"
          echo "   Commit message must include a 'Signed-off-by:' line."
          echo "   Use 'git commit -s' to sign off automatically."
          echo "   See CONTRIBUTING.md § Commit Sign-Off (DCO) for details."
          exit 1
        fi
      fail_text: "Missing DCO sign-off. Run 'git commit -s' to sign off."

pre-commit:
  parallel: true
  jobs:
    - name: Lint and format specification files
      glob: '*.{md,mdx,json,yaml,yml,mjs}'
      run: |
        set -e
        echo "🔍 Running markdownlint-cli2 --fix on staged Markdown files..."
        for f in {staged_files}; do
          case "$f" in
            *.md|*.mdx) bunx markdownlint-cli2 --fix "$f" ;;
          esac
        done
        echo "✨ Running prettier --write on staged files..."
        bunx prettier --write {staged_files}
        echo "📦 Re-staging fixed files..."
        git add {staged_files}
        echo "✅ Pre-commit checks completed!"
    - name: Validate OpenAPI specification
      glob: 'openapi/*'
      run: |
        set -e
        echo "🔍 Running Redocly lint..."
        bunx redocly lint openapi/bibliotheca.openapi.yaml
        echo "✅ OpenAPI lint passed!"
    - name: Validate specification artifacts
      glob: '{schemas,conformance}/**'
      run: |
        set -e
        echo "🔍 Running artifact validation..."
        bun run validate:artifacts
        echo "✅ Artifact validation passed!"
