# Lefthook pre-commit configuration
# Documentation: https://lefthook.dev/configuration/

commit-msg:
  commands:
    dco-signoff:
      run: |
        if ! grep -qE "^Signed-off-by: " "{1}"; then
          echo "❌ DCO sign-off missing"
          echo "   Commit message must include a 'Signed-off-by:' line."
          echo "   Use 'git commit -s' to sign off automatically."
          echo "   See CONTRIBUTING.md § Commit Sign-Off (DCO) for details."
          exit 1
        fi
      fail_text: "Missing DCO sign-off. Run 'git commit -s' to sign off."

pre-commit:
  parallel: false
  jobs:
    - name: Lint and format specification files
      glob:
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.json"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.mjs"
        - "**/*.cjs"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.mts"
        - "**/*.cts"
        - "**/*.mdc"
        - ".prettierrc"
      run: |
        set -e
        echo "🔍 Running markdownlint-cli2 --fix on staged Markdown files..."
        for f in {staged_files}; do
          case "$f" in
            *.md|*.mdx) bun run lint:md:fix:files -- "$f" ;;
          esac
        done
        echo "✨ Running prettier --write on staged files..."
        bun run format:files -- {staged_files}
        echo "📦 Re-staging fixed files..."
        git add {staged_files}
        echo "✅ Pre-commit checks completed!"
    - name: Regenerate site publication artifacts
      glob:
        - "agent-volumes-spec.md"
        - "openapi/**"
        - "schemas/**"
        - "scripts/build-site-openapi.mts"
        - "scripts/build-site-schemas.mts"
        - "package.json"
        - "bun.lock"
      run: |
        set -e
        echo "📚 Rebuilding Mintlify OpenAPI publication artifact..."
        bun run build:site:openapi
        echo "📚 Rebuilding Mintlify schema publication artifacts..."
        bun run build:site:schemas
        echo "📦 Re-staging generated publication artifacts..."
        git add site/spec
        echo "✅ Publication artifacts regenerated!"
    - name: Check repository formatting
      glob:
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.json"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.mjs"
        - "**/*.cjs"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.mts"
        - "**/*.cts"
        - "**/*.mdc"
        - ".prettierrc"
      run: |
        set -e
        echo "✨ Checking repository formatting..."
        bun run format:check
        echo "✅ Repository formatting check passed!"
    - name: Lint JavaScript and TypeScript with Oxlint
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.mjs"
        - "**/*.cjs"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.mts"
        - "**/*.cts"
        - ".oxlintrc.json"
        - "package.json"
        - "bun.lock"
        - "tsconfig.json"
      run: |
        set -e
        echo "🔍 Running Oxlint..."
        bun run lint:oxlint
        echo "✅ Oxlint passed!"
    - name: Lint Markdown
      glob:
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.mdc"
        - ".markdownlint-cli2.jsonc"
      run: |
        set -e
        echo "🔍 Running markdownlint..."
        bun run lint:md
        echo "✅ Markdown lint passed!"
    - name: Lint OpenAPI specification
      glob:
        - "openapi/**"
        - "schemas/**"
        - "redocly.yaml"
        - "package.json"
        - "bun.lock"
      run: |
        set -e
        echo "🔍 Running Redocly lint..."
        bun run lint:openapi
        echo "✅ OpenAPI lint passed!"
    - name: Validate Mintlify documentation site
      glob:
        - "site/**"
        - "agent-volumes-spec.md"
        - "openapi/**"
        - "schemas/**"
        - "scripts/build-site-openapi.mts"
        - "scripts/build-site-schemas.mts"
        - "package.json"
        - "bun.lock"
      run: |
        set -e
        echo "🌐 Validating Mintlify documentation site..."
        bun run lint:site
        echo "✅ Mintlify site validation passed!"
    - name: Validate changelog structure
      glob:
        - "CHANGELOG.md"
        - "cliff.toml"
        - "package.json"
        - "bun.lock"
        - "scripts/**"
      run: |
        set -e
        echo "🔍 Validating changelog structure..."
        bun run changelog:check
        echo "✅ Changelog validation passed!"
    - name: Validate specification artifacts
      glob:
        - "agent-volumes-spec.md"
        - "schemas/**"
        - "conformance/**"
        - "openapi/**"
        - "scripts/validate-artifacts.mts"
        - "package.json"
        - "bun.lock"
      run: |
        set -e
        echo "🔍 Running artifact validation..."
        bun run validate:artifacts
        echo "✅ Artifact validation passed!"
