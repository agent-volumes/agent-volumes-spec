name: Specification Lint and Format

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.mdc"
      - "**/*.json"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mts"
      - "**/*.cts"
      - "**/*.yaml"
      - "**/*.yml"
      - "scripts/**"
      - "cliff.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/spec-lint-and-format.yml"
      - ".markdownlint-cli2.jsonc"
      - ".oxlintrc.json"
      - ".prettierrc"
      - "redocly.yaml"
      - "openapi/**"
      - "schemas/**"
      - "conformance/**"
      - "site/**"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.mdc"
      - "**/*.json"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mts"
      - "**/*.cts"
      - "**/*.yaml"
      - "**/*.yml"
      - "scripts/**"
      - "cliff.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/spec-lint-and-format.yml"
      - ".markdownlint-cli2.jsonc"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".prettierrc"
      - "redocly.yaml"
      - "openapi/**"
      - "schemas/**"
      - "conformance/**"
      - "site/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Mintlify site dependencies
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Check JavaScript and TypeScript formatting with Oxfmt
        run: bun run format:oxfmt:check

      - name: Check non-JS/TS formatting with Prettier
        run: bun run format:prettier:check

      - name: Lint JavaScript and TypeScript with Oxlint
        run: bun run lint:oxlint:github

      - name: Validate changelog structure
        run: bun run changelog:check

      - name: Lint Markdown with markdownlint
        run: bun run lint:md

      - name: Lint OpenAPI with Redocly
        run: bun run lint:openapi

      - name: Validate Mintlify documentation site
        run: bun run lint:site

      - name: Validate specification artifacts
        run: bun run validate:artifacts
