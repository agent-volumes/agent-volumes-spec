name: Release Publication Artifacts

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      spec-version:
        description: SemVer release version to regenerate and verify, without the v prefix.
        required: true
        type: string

jobs:
  verify-publication-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Mintlify site dependencies
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Build Mintlify publication artifacts
        env:
          SPEC_VERSION: ${{ inputs.spec-version }}
        run: |
          bun run build:site:openapi -- "${SPEC_VERSION}"
          bun run build:site:schemas -- "${SPEC_VERSION}"

      - name: Check Mintlify publication artifacts are current
        env:
          SPEC_VERSION: ${{ inputs.spec-version }}
        run: |
          OPENAPI_PUBLICATION_ARTIFACT="site/spec/${SPEC_VERSION}/api-reference/bibliotheca.openapi.json"
          SCHEMA_PUBLICATION_ARTIFACTS="site/spec/${SPEC_VERSION}/schemas"
          if [[ -n "$(GIT_MASTER=1 git status --porcelain -- "${OPENAPI_PUBLICATION_ARTIFACT}" "${SCHEMA_PUBLICATION_ARTIFACTS}")" ]]; then
            GIT_MASTER=1 git status --short -- "${OPENAPI_PUBLICATION_ARTIFACT}" "${SCHEMA_PUBLICATION_ARTIFACTS}"
            exit 1
          fi

      - name: Validate specification artifacts with release publication drift checks
        env:
          RELEASE_PUBLICATION_DRIFT_CHECK: "1"
        run: bun run validate:artifacts
