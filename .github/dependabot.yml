# Dependabot configuration for agent-volumes-spec
# Automated dependency updates for spec repository development tooling and workflows.
# Security updates bypass cooldowns; cooldowns apply only to scheduled version updates.
#
# References:
# - https://docs.github.com/en/code-security/dependabot
# - https://github.com/agent-volumes/.github/blob/main/docs/security/dependency-security.md

version: 2

updates:
  # Bun ecosystem - root development tooling for linting, formatting, and schema validation.
  # Uses package.json with bun.lock for deterministic dependency resolution.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      # Group minor and patch updates for low-risk development tooling.
      # Major updates remain separate for explicit review.
      dev-dependencies:
        patterns:
          - "@colbymchenry/codegraph"
          - "@redocly/cli"
          - "@tsconfig/bun"
          - "@types/bun"
          - "ajv"
          - "ajv-formats"
          - "git-cliff"
          - "lefthook"
          - "markdownlint-cli2"
          - "oxfmt"
          - "oxlint"
          - "oxlint-tsgolint"
          - "prettier"
          - "protobufjs"
          - "yaml"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      prefix-development: "chore(dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "js/ts"
    versioning-strategy: "auto"
    # Cooldown: NPM/Bun development dependencies per dependency-security.md.
    # Patch: 1-3 days | Minor: 3-7 days | Major: 14-21 days
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 1

  # Bun ecosystem - Mintlify documentation site tooling.
  # The site subtree has its own package.json and bun.lock.
  - package-ecosystem: "bun"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      # Group minor and patch updates for low-risk documentation tooling.
      # Major updates remain separate for explicit review.
      site-dependencies:
        patterns:
          - "mint"
          - "qs"
          - "ws"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "docs"
      include: "scope"
    labels:
      - "dependencies"
      - "documentation"
      - "js/ts"
    versioning-strategy: "auto"
    # Cooldown: NPM/Bun development dependencies per dependency-security.md.
    # Patch: 1-3 days | Minor: 3-7 days | Major: 14-21 days
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 1

  # GitHub Actions - workflow actions are SHA-pinned where required by org policy.
  # Reusable workflows from agent-volumes/.github may stay on @main per org exception.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      # Group GitHub official actions together.
      github-actions:
        patterns:
          - "actions/*"
        update-types:
          - "minor"
          - "patch"
      # Group step-security actions such as harden-runner.
      step-security-actions:
        patterns:
          - "step-security/*"
        update-types:
          - "minor"
          - "patch"
      # Group Bun setup action updates used by validation and release workflows.
      bun-actions:
        patterns:
          - "oven-sh/setup-bun"
        update-types:
          - "minor"
          - "patch"
      # Keep OpenSSF Scorecard updates grouped if inline usage is added later.
      scorecard-actions:
        patterns:
          - "ossf/scorecard-action"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    # Cooldown: GitHub Actions only supports default-days, not SemVer cooldown.
    cooldown:
      default-days: 3
