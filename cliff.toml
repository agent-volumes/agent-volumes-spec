[remote.github]
owner = "agent-volumes"
repo = "agent-volumes-spec"

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - 1{{ timestamp | date(format="%Y-%m-%d") }} HE
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/agent-volumes/agent-volumes-spec/pull/{{ commit.remote.pr_number }})){% endif %}
{% endfor %}
{% endfor %}
"""
footer = """
{% for release in releases %}
{% if release.version %}
{% if release.previous.version %}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/agent-volumes/agent-volumes-spec/compare/{{ release.previous.version }}...{{ release.version }}
{% else %}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/agent-volumes/agent-volumes-spec/tree/{{ release.version }}
{% endif %}
{% else %}
[Unreleased]: https://github.com/agent-volumes/agent-volumes-spec/compare/{{ release.previous.version }}...HEAD
{% endif %}
{% endfor %}
<!-- generated by git-cliff; maintainers curate entries before release -->
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-(?:draft|rc)\\.[0-9]+)?$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^security", group = "Security" },
  { body = "(?i).*\\b(cve|vulnerability)\\b.*", group = "Security" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^deprecat", group = "Deprecated" },
  { message = "^(remove|delete|drop)", group = "Removed" },
  { message = "^(docs|refactor|perf|build|ci)", group = "Changed" },
  { message = "^chore\\((ci|deps|github|markdown|release|skills)\\)", group = "Changed" },
  { message = "^chore", group = "Changed" },
  { message = ".*", group = "Changed" },
]
