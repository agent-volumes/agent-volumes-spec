components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    NameSegment:
      type: string
      pattern: ^(?!.*--)[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
    ScopeName:
      type: string
      maxLength: 64
      pattern: ^(?!.*--)[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
    VolumeName:
      type: string
      maxLength: 194
      description: Canonical full user-facing volume name. Scoped volumes use @scope/name; scopeless volumes use name.
      pattern: ^(@(?!.*--)[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?/)?(?!.*--)[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$
    SemVer:
      type: string
      pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
    Digest:
      type: string
      pattern: ^sha256:[a-f0-9]{64}$
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details. Agent Volumes baseline problem type URIs use https://agentvolumes.org/problems/<slug>.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          pattern: ^https://agentvolumes\.org/problems/[a-z0-9-]+$
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    SearchResults:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, latestVersion]
            properties:
              name:
                $ref: '#/components/schemas/VolumeName'
              latestVersion:
                $ref: '#/components/schemas/SemVer'
              description:
                type: string
              role:
                type: string
              providers:
                type: array
                items:
                  type: string
              components:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    name:
                      type: string
        total:
          type: integer
          description: Total matching results for the bibliotheca-local query snapshot.
          minimum: 0
        limit:
          type: integer
          description: Page size used for this catalog search response; not a resolver ordering signal.
          minimum: 1
        offset:
          type: integer
          description: Zero-based offset used for this catalog search response; search ordering remains bibliotheca-local.
          minimum: 0
    ReleaseUploadIntentRequest:
      type: object
      additionalProperties: false
      description: The target package name is route-derived. This body supplies the target version and upload constraints; it does not override the path identity.
      required: [version, mediaType]
      properties:
        version:
          $ref: '#/components/schemas/SemVer'
        mediaType:
          type: string
          const: application/gzip
        declaredDigest:
          $ref: '#/components/schemas/Digest'
        declaredSize:
          type: integer
          minimum: 0
        idempotencyKey:
          type: string
    ReleaseMetadata:
      type: object
      required: [name, version, integrity, status]
      properties:
        name:
          $ref: '#/components/schemas/VolumeName'
        version:
          $ref: '#/components/schemas/SemVer'
        integrity:
          $ref: '#/components/schemas/Digest'
        status:
          $ref: '#/components/schemas/VersionStatus'
        dist:
          oneOf:
            - type: object
              required: [source, mediaType, url]
              properties:
                source:
                  type: string
                  const: cdn
                mediaType:
                  type: string
                  description: Gzip-compressed tar archive transport for the hosted Agent Volumes archive profile.
                  const: application/gzip
                url:
                  type: string
                  description: Opaque portable download locator for the hosted .tar.gz archive bytes. Clients verify the normalized-file-tree digest against release integrity after retrieval.
                  format: uri
            - type: object
              required: [source, repository, ref]
              properties:
                source:
                  type: string
                  const: git
                repository:
                  type: string
                  format: uri
                ref:
                  type: string
      allOf:
        - if:
            properties:
              status:
                type: object
                properties:
                  state:
                    enum: [available, yanked]
                required: [state]
            required: [status]
          then:
            required: [dist]
    VersionStatus:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [available, yanked, tombstoned, blocked, unavailable]
        reason:
          type: string
    TrustUploadIntentRequest:
      type: object
      additionalProperties: false
      required: [subject, attachment, declaredDigest]
      properties:
        subject:
          type: object
          additionalProperties: false
          required: [purl, integrity]
          properties:
            purl:
              type: string
              pattern: ^pkg:volume/.+@(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
            integrity:
              $ref: '#/components/schemas/Digest'
        attachment:
          type: object
          additionalProperties: false
          required: [category, format]
          properties:
            category:
              type: string
              enum: [bom, provenance, signature, other]
            format:
              type: object
              additionalProperties: false
              required: [family, mediaType]
              properties:
                family:
                  type: string
                mediaType:
                  type: string
                predicateType:
                  type: string
                  format: uri
                profile:
                  type: string
                version:
                  type: string
        declaredDigest:
          $ref: '#/components/schemas/Digest'
        declaredSize:
          type: integer
          minimum: 0
    TrustUploadFinalizeRequest:
      type: object
      additionalProperties: false
      properties:
        idempotencyKey:
          type: string
    BridgeMetadata:
      $ref: ../schemas/bridge-metadata.schema.json
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication required or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Authenticated caller lacks permission for this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Resource conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Gone:
      description: Resource no longer available, such as an expired upload intent
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PayloadTooLarge:
      description: Payload too large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Rate limited
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
