openapi: 3.1.1
info:
  title: Agent Volumes Bibliotheca API
  version: 0.1.0-draft.5
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
security: []
paths:
  /api/v1/search:
    get:
      summary: Search the bibliotheca catalog for matching volumes
      operationId: searchVolumes
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [agent, skill, command, tool, hook, mcp-server, lsp-server]
        - in: query
          name: runtime
          schema:
            type: string
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: publisher
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/{name}:
    post:
      summary: Publish an unscoped volume
      operationId: publishVolume
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Published release metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/@{scope}/{name}:
    post:
      summary: Publish a scoped volume
      operationId: publishScopedVolume
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Published release metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/{name}/{version}:
    get:
      summary: Fetch volume release metadata
      operationId: getVolumeRelease
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Release metadata. Delivery metadata is subordinate to the release integrity value; clients reject resolved content whose normalized-file-tree digest does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      summary: Unpublish an unscoped volume version
      operationId: unpublishVolumeRelease
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Unpublish accepted or tombstoned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/@{scope}/{name}/{version}:
    get:
      summary: Fetch scoped volume release metadata
      operationId: getScopedVolumeRelease
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Release metadata. Delivery metadata is subordinate to the release integrity value; clients reject resolved content whose normalized-file-tree digest does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      summary: Unpublish a scoped volume version
      operationId: unpublishScopedVolumeRelease
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Unpublish accepted or tombstoned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/index/volumes/{name}:
    get:
      summary: Fetch resolver-facing version index rows for an unscoped volume
      operationId: getVolumeVersionIndex
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package-scoped version index rows. Clients still fetch exact release metadata before installation or trust evaluation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../schemas/version-index-row.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/index/volumes/@{scope}/{name}:
    get:
      summary: Fetch resolver-facing version index rows for a scoped volume
      operationId: getScopedVolumeVersionIndex
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package-scoped version index rows. Clients still fetch exact release metadata before installation or trust evaluation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../schemas/version-index-row.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/{name}/{version}/trust/summary:
    get:
      summary: Trust summary for a release
      operationId: getVolumeTrustSummary
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trust summary. If the release exists but no trust artifacts are present, returns `200 OK` with an empty `artifacts` array. An empty success response does not by itself indicate successful verification, trusted status, or policy compliance.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-summary.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/@{scope}/{name}/{version}/trust/summary:
    get:
      summary: Trust summary for a scoped release
      operationId: getScopedVolumeTrustSummary
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trust summary. If the release exists but no trust artifacts are present, returns `200 OK` with an empty `artifacts` array. An empty success response does not by itself indicate successful verification, trusted status, or policy compliance.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-summary.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/{name}/{version}/trust/detail:
    get:
      summary: Trust detail for a release
      operationId: getVolumeTrustDetail
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trust detail. If the release exists but no trust artifacts are present, returns `200 OK` with an empty `attachments` array. An empty success response does not by itself indicate successful verification, trusted status, or policy compliance.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-detail.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/{name}/{version}/trust/uploads:
    post:
      summary: Create a trust attachment upload intent for an unscoped release
      operationId: createVolumeTrustUploadIntent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustUploadIntentRequest'
      responses:
        '201':
          description: Upload intent created. Upload instructions are opaque implementation data.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-upload-intent.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/{name}/{version}/trust/uploads/{uploadId}/finalize:
    post:
      summary: Finalize a trust attachment upload for an unscoped release
      operationId: finalizeVolumeTrustUpload
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustUploadFinalizeRequest'
      responses:
        '201':
          description: Upload finalized and trust attachment made available through trust discovery.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-upload-finalize.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/@{scope}/{name}/{version}/trust/detail:
    get:
      summary: Trust detail for a scoped release
      operationId: getScopedVolumeTrustDetail
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trust detail. If the release exists but no trust artifacts are present, returns `200 OK` with an empty `attachments` array. An empty success response does not by itself indicate successful verification, trusted status, or policy compliance.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-detail.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/@{scope}/{name}/{version}/trust/uploads:
    post:
      summary: Create a trust attachment upload intent for a scoped release
      operationId: createScopedVolumeTrustUploadIntent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustUploadIntentRequest'
      responses:
        '201':
          description: Upload intent created. Upload instructions are opaque implementation data.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-upload-intent.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/@{scope}/{name}/{version}/trust/uploads/{uploadId}/finalize:
    post:
      summary: Finalize a trust attachment upload for a scoped release
      operationId: finalizeScopedVolumeTrustUpload
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustUploadFinalizeRequest'
      responses:
        '201':
          description: Upload finalized and trust attachment made available through trust discovery.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-upload-finalize.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/advisories:
    get:
      summary: Search advisories
      operationId: searchAdvisories
      parameters:
        - in: query
          name: volume
          schema:
            type: string
      responses:
        '200':
          description: Advisory list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../schemas/advisory.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/advisories/{advisoryId}:
    get:
      summary: Fetch one advisory
      operationId: getAdvisory
      parameters:
        - in: path
          name: advisoryId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Advisory payload
          content:
            application/json:
              schema:
                $ref: ../schemas/advisory.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/capabilities:
    get:
      summary: Bibliotheca capability metadata
      operationId: getCapabilityMetadata
      responses:
        '200':
          description: Capability metadata
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/capability-metadata.schema.json
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    SearchResults:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, latestVersion]
            properties:
              name:
                type: string
              latestVersion:
                type: string
              description:
                type: string
              role:
                type: string
              providers:
                type: array
                items:
                  type: string
              components:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    name:
                      type: string
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    ReleaseMetadata:
      type: object
      required: [name, version, integrity, dist]
      properties:
        name:
          type: string
        version:
          type: string
        integrity:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        dist:
          oneOf:
            - type: object
              required: [source, mediaType, url]
              properties:
                source:
                  type: string
                  const: cdn
                mediaType:
                  type: string
                  const: application/gzip
                url:
                  type: string
                  format: uri
            - type: object
              required: [source, repository, ref]
              properties:
                source:
                  type: string
                  const: git
                repository:
                  type: string
                  format: uri
                ref:
                  type: string
    TrustUploadIntentRequest:
      type: object
      additionalProperties: false
      required: [subject, attachment, declaredDigest]
      properties:
        subject:
          type: object
          additionalProperties: false
          required: [purl, integrity]
          properties:
            purl:
              type: string
              pattern: ^pkg:volume/.+@(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
            integrity:
              type: string
              pattern: ^sha256:[a-f0-9]{64}$
        attachment:
          type: object
          additionalProperties: false
          required: [category, format]
          properties:
            category:
              type: string
              enum: [bom, provenance, signature, other]
            format:
              type: object
              additionalProperties: false
              required: [family, mediaType]
              properties:
                family:
                  type: string
                mediaType:
                  type: string
                predicateType:
                  type: string
                  format: uri
                profile:
                  type: string
                version:
                  type: string
        declaredDigest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        declaredSize:
          type: integer
          minimum: 0
    TrustUploadFinalizeRequest:
      type: object
      additionalProperties: false
      properties:
        idempotencyKey:
          type: string
    BridgeMetadata:
      $ref: ../schemas/bridge-metadata.schema.json
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication required or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Authenticated caller lacks permission for this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Resource conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Gone:
      description: Resource no longer available, such as an expired upload intent
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PayloadTooLarge:
      description: Payload too large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Rate limited
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
