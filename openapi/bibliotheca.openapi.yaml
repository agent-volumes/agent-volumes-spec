openapi: 3.1.1
info:
  title: Agent Volumes Bibliotheca API
  version: 0.1.0-rc.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
security: []
paths:
  /api/v1/search:
    get:
      summary: Search the bibliotheca catalog for matching volumes
      operationId: searchVolumes
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [agent, skill, command, tool, hook, mcp-server, lsp-server]
        - in: query
          name: runtime
          schema:
            type: string
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: publisher
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/{name}:
    post:
      summary: Create a release upload intent for an unscoped volume
      operationId: createVolumeUploadIntent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: header
          name: Idempotency-Key
          required: false
          description: Preferred portable idempotency key. If this header and a body idempotencyKey are both present, they MUST match exactly.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseUploadIntentRequest"
      responses:
        "201":
          description: Upload intent created. Upload instructions are opaque implementation data.
          content:
            application/json:
              schema:
                $ref: ../schemas/release-upload-intent.schema.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/{name}/uploads/{uploadId}/finalize:
    post:
      summary: Finalize a release upload for an unscoped volume
      operationId: finalizeVolumeUpload
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          description: Preferred portable idempotency key for finalize. If an operation also accepts a body idempotencyKey, the two values MUST match exactly.
          schema:
            type: string
      responses:
        "201":
          description: Published release metadata
          content:
            application/json:
              schema:
                $ref: ../schemas/release-upload-finalize.schema.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/@{scope}/{name}:
    post:
      summary: Create a release upload intent for a scoped volume
      operationId: createScopedVolumeUploadIntent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/ScopeName"
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: header
          name: Idempotency-Key
          required: false
          description: Preferred portable idempotency key. If this header and a body idempotencyKey are both present, they MUST match exactly.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseUploadIntentRequest"
      responses:
        "201":
          description: Upload intent created. Upload instructions are opaque implementation data.
          content:
            application/json:
              schema:
                $ref: ../schemas/release-upload-intent.schema.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/@{scope}/{name}/uploads/{uploadId}/finalize:
    post:
      summary: Finalize a release upload for a scoped volume
      operationId: finalizeScopedVolumeUpload
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/ScopeName"
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          description: Preferred portable idempotency key for finalize. If an operation also accepts a body idempotencyKey, the two values MUST match exactly.
          schema:
            type: string
      responses:
        "201":
          description: Published release metadata
          content:
            application/json:
              schema:
                $ref: ../schemas/release-upload-finalize.schema.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/{name}/{version}:
    get:
      summary: Fetch volume release metadata
      operationId: getVolumeRelease
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
      responses:
        "200":
          description: Release metadata. Delivery metadata is subordinate to the release integrity value; clients reject resolved content whose normalized-file-tree digest does not match.
          content:
            application/json:
              schema:
                $ref: ../schemas/release-metadata.schema.json
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      summary: Unpublish an unscoped volume version
      operationId: unpublishVolumeRelease
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
      responses:
        "202":
          description: Unpublish accepted or tombstoned
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/@{scope}/{name}/{version}:
    get:
      summary: Fetch scoped volume release metadata
      operationId: getScopedVolumeRelease
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/ScopeName"
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
      responses:
        "200":
          description: Release metadata. Delivery metadata is subordinate to the release integrity value; clients reject resolved content whose normalized-file-tree digest does not match.
          content:
            application/json:
              schema:
                $ref: ../schemas/release-metadata.schema.json
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      summary: Unpublish a scoped volume version
      operationId: unpublishScopedVolumeRelease
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/ScopeName"
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
      responses:
        "202":
          description: Unpublish accepted or tombstoned
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/index/volumes/{name}:
    get:
      summary: Fetch resolver-facing version index rows for an unscoped volume
      operationId: getVolumeVersionIndex
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
      responses:
        "200":
          description: Package-scoped version index rows. Clients still fetch exact release metadata before installation or trust evaluation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionIndex"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/index/volumes/@{scope}/{name}:
    get:
      summary: Fetch resolver-facing version index rows for a scoped volume
      operationId: getScopedVolumeVersionIndex
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/ScopeName"
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
      responses:
        "200":
          description: Package-scoped version index rows. Clients still fetch exact release metadata before installation or trust evaluation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionIndex"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/{name}/{version}/trust/summary:
    get:
      summary: Trust summary for a release
      operationId: getVolumeTrustSummary
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
      responses:
        "200":
          description: Trust summary. If the release exists but no trust artifacts are present, returns `200 OK` with an empty `artifacts` array. An empty success response does not by itself indicate successful verification, trusted status, or policy compliance.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-summary.schema.json
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/@{scope}/{name}/{version}/trust/summary:
    get:
      summary: Trust summary for a scoped release
      operationId: getScopedVolumeTrustSummary
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/ScopeName"
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
      responses:
        "200":
          description: Trust summary. If the release exists but no trust artifacts are present, returns `200 OK` with an empty `artifacts` array. An empty success response does not by itself indicate successful verification, trusted status, or policy compliance.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-summary.schema.json
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/{name}/{version}/trust/detail:
    get:
      summary: Trust detail for a release
      operationId: getVolumeTrustDetail
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
      responses:
        "200":
          description: Trust detail. If the release exists but no trust artifacts are present, returns `200 OK` with an empty `attachments` array. An empty success response does not by itself indicate successful verification, trusted status, or policy compliance.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-detail.schema.json
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/{name}/{version}/trust/uploads:
    post:
      summary: Create a trust attachment upload intent for an unscoped release
      operationId: createVolumeTrustUploadIntent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
        - in: header
          name: Idempotency-Key
          required: false
          description: Preferred portable idempotency key. If this header and a body idempotencyKey are both present, they MUST match exactly.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustUploadIntentRequest"
      responses:
        "201":
          description: Upload intent created. Upload instructions are opaque implementation data.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-upload-intent.schema.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/{name}/{version}/trust/uploads/{uploadId}/finalize:
    post:
      summary: Finalize a trust attachment upload for an unscoped release
      operationId: finalizeVolumeTrustUpload
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          description: Preferred portable idempotency key for finalize. If this header and a body idempotencyKey are both present, they MUST match exactly.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustUploadFinalizeRequest"
      responses:
        "201":
          description: Upload finalized and trust attachment made available through trust discovery.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-upload-finalize.schema.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/@{scope}/{name}/{version}/trust/detail:
    get:
      summary: Trust detail for a scoped release
      operationId: getScopedVolumeTrustDetail
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/ScopeName"
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
      responses:
        "200":
          description: Trust detail. If the release exists but no trust artifacts are present, returns `200 OK` with an empty `attachments` array. An empty success response does not by itself indicate successful verification, trusted status, or policy compliance.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-detail.schema.json
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/@{scope}/{name}/{version}/trust/uploads:
    post:
      summary: Create a trust attachment upload intent for a scoped release
      operationId: createScopedVolumeTrustUploadIntent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/ScopeName"
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
        - in: header
          name: Idempotency-Key
          required: false
          description: Preferred portable idempotency key. If this header and a body idempotencyKey are both present, they MUST match exactly.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustUploadIntentRequest"
      responses:
        "201":
          description: Upload intent created. Upload instructions are opaque implementation data.
          content:
            application/json:
              schema:
                $ref: ../schemas/trust-upload-intent.schema.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/volumes/@{scope}/{name}/{version}/trust/uploads/{uploadId}/finalize:
    post:
      summary: Finalize a trust attachment upload for a scoped release
      operationId: finalizeScopedVolumeTrustUpload
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/ScopeName"
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/NameSegment"
        - in: path
          name: version
          required: true
          schema:
            $ref: "#/components/schemas/SemVer"
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          description: Preferred portable idempotency key for finalize. If this header and a body idempotencyKey are both present, they MUST match exactly.
          schema:
            type: string
      requestBody:
