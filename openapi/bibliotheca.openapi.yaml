          content:
            application/json:
              schema:
                $ref: ../schemas/trust-upload-finalize.schema.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/advisories:
    get:
      summary: Search advisories
      operationId: searchAdvisories
      parameters:
        - in: query
          name: volume
          schema:
            type: string
      responses:
        "200":
          description: Advisory list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisoryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/advisories/{advisoryId}:
    get:
      summary: Fetch one advisory
      operationId: getAdvisory
      parameters:
        - in: path
          name: advisoryId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Advisory payload
          content:
            application/json:
              schema:
                $ref: ../schemas/advisory.schema.json
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/capabilities:
    get:
      summary: Bibliotheca capability metadata
      description: Returns registry-level capability metadata, including capability schema/spec versions, HTTP API major family, and supported upload profiles such as the v0.1 `http-put` baseline.
      operationId: getCapabilityMetadata
      responses:
        "200":
          description: Capability metadata
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/capability-metadata.schema.json
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    NameSegment:
      type: string
      maxLength: 128
      pattern: ^(?!.*--)[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
    ScopeName:
      type: string
      maxLength: 64
      pattern: ^(?!.*--)[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
    VolumeName:
      type: string
      maxLength: 194
      description: Canonical full user-facing volume name. Scoped volumes use @scope/name; scopeless volumes use name.
      pattern: ^(@(?!.*--)[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?/)?(?!.*--)[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$
    SemVer:
      type: string
      pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
    ReleasePurl:
      type: string
      pattern: ^pkg:volume/(?:%40(?![a-z0-9-]*--)[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?/)?(?![a-z0-9-]*--)[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?@(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
    Digest:
      type: string
      pattern: ^sha256:[a-f0-9]{64}$
    ProblemDetails:
      oneOf:
        - $ref: "#/components/schemas/AuthenticationRequiredProblem"
        - $ref: "#/components/schemas/AuthorizationFailedProblem"
        - $ref: "#/components/schemas/NotFoundProblem"
        - $ref: "#/components/schemas/ValidationFailedProblem"
        - $ref: "#/components/schemas/InvalidManifestProblem"
        - $ref: "#/components/schemas/InvalidArchiveProblem"
        - $ref: "#/components/schemas/IdentityMismatchProblem"
        - $ref: "#/components/schemas/VersionConflictProblem"
        - $ref: "#/components/schemas/DigestMismatchProblem"
        - $ref: "#/components/schemas/SubjectBindingMismatchProblem"
        - $ref: "#/components/schemas/InconsistentRegistryStateProblem"
        - $ref: "#/components/schemas/UploadExpiredProblem"
        - $ref: "#/components/schemas/MissingUploadedBytesProblem"
        - $ref: "#/components/schemas/InvalidUploadStateProblem"
        - $ref: "#/components/schemas/IdempotencyConflictProblem"
        - $ref: "#/components/schemas/PayloadTooLargeProblem"
        - $ref: "#/components/schemas/UnsupportedMediaTypeProblem"
        - $ref: "#/components/schemas/PermissionEscalationProblem"
        - $ref: "#/components/schemas/RateLimitedProblem"
    ProblemDetailsBase:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    AuthenticationRequiredProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/authentication-required
            status:
              const: 401
    AuthorizationFailedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/authorization-failed
            status:
              const: 403
    NotFoundProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/not-found
            status:
              const: 404
    ValidationFailedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/validation-failed
            status:
              const: 400
    InvalidManifestProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/invalid-manifest
            status:
              const: 400
    InvalidArchiveProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/invalid-archive
            status:
              const: 400
    IdentityMismatchProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/identity-mismatch
            status:
              const: 409
    VersionConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/version-conflict
            status:
              const: 409
    DigestMismatchProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/digest-mismatch
            status:
              const: 400
    SubjectBindingMismatchProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/subject-binding-mismatch
            status:
              const: 400
    InconsistentRegistryStateProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/inconsistent-registry-state
            status:
              const: 409
    UploadExpiredProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/upload-expired
            status:
              const: 410
    MissingUploadedBytesProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/missing-uploaded-bytes
            status:
              const: 400
    InvalidUploadStateProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/invalid-upload-state
            status:
              const: 409
    IdempotencyConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/idempotency-conflict
            status:
              const: 409
    PayloadTooLargeProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/payload-too-large
            status:
              const: 413
    UnsupportedMediaTypeProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/unsupported-media-type
            status:
              const: 415
    PermissionEscalationProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/permission-escalation
            status:
              const: 400
    RateLimitedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetailsBase"
        - type: object
          properties:
            type:
              const: https://agentvolumes.org/problems/rate-limited
            status:
              const: 429
    SearchResults:
      $ref: ../schemas/search-results.schema.json
    VersionIndex:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ../schemas/version-index-row.schema.json
    AdvisoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ../schemas/advisory.schema.json
    ReleaseUploadIntentRequest:
      type: object
      additionalProperties: false
      description: The target package name is route-derived. This body supplies the target version and upload constraints; it does not override the path identity.
      required: [version, mediaType]
      properties:
        version:
          $ref: "#/components/schemas/SemVer"
        mediaType:
          type: string
          const: application/gzip
        declaredDigest:
          $ref: "#/components/schemas/Digest"
        declaredSize:
          type: integer
          minimum: 0
          description: Declared trust attachment byte size. A bibliotheca can reject the upload intent with 413 Payload Too Large when this value exceeds its accepted trust attachment size limit before byte transfer begins.
        idempotencyKey:
          type: string
    VersionStatus:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [available, yanked, tombstoned, blocked, unavailable]
        reason:
          type: string
    TrustUploadIntentRequest:
      type: object
      additionalProperties: false
      required: [subject, attachment, declaredDigest]
      properties:
        subject:
          type: object
          additionalProperties: false
          required: [purl, integrity]
          properties:
            purl:
              $ref: "#/components/schemas/ReleasePurl"
            integrity:
              $ref: "#/components/schemas/Digest"
        attachment:
          type: object
          additionalProperties: false
          required: [category, format]
          properties:
            category:
              type: string
              enum: [bom, provenance, signature, other]
            format:
              type: object
              additionalProperties: false
              required: [family, mediaType]
              properties:
                family:
                  type: string
                mediaType:
                  type: string
                predicateType:
                  type: string
                  format: uri
                profile:
                  type: string
                version:
                  type: string
        declaredDigest:
          $ref: "#/components/schemas/Digest"
        declaredSize:
          type: integer
          minimum: 0
    TrustUploadFinalizeRequest:
      type: object
      additionalProperties: false
      properties:
        idempotencyKey:
          type: string
    BridgeMetadata:
      $ref: ../schemas/bridge-metadata.schema.json
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            validationFailed:
              summary: Request or metadata validation failed
              value:
                type: https://agentvolumes.org/problems/validation-failed
                title: Validation failed
                status: 400
            invalidManifest:
              summary: Submitted volume.toml is invalid
              value:
                type: https://agentvolumes.org/problems/invalid-manifest
                title: Invalid manifest
                status: 400
            invalidArchive:
              summary: Submitted archive violates the transport profile
              value:
                type: https://agentvolumes.org/problems/invalid-archive
                title: Invalid archive
                status: 400
            digestMismatch:
              summary: Submitted bytes do not match the declared digest
              value:
                type: https://agentvolumes.org/problems/digest-mismatch
                title: Digest mismatch
                status: 400
            subjectBindingMismatch:
              summary: Trust artifact subject does not match the release
              value:
                type: https://agentvolumes.org/problems/subject-binding-mismatch
                title: Subject binding mismatch
                status: 400
            missingUploadedBytes:
              summary: Finalize was requested before upload bytes were available
              value:
                type: https://agentvolumes.org/problems/missing-uploaded-bytes
                title: Missing uploaded bytes
                status: 400
    Unauthorized:
      description: Authentication needed or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            authenticationRequired:
              value:
                type: https://agentvolumes.org/problems/authentication-required
                title: Authentication required
                status: 401
    Forbidden:
      description: Request is refused by authorization or access policy
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            authorizationFailed:
              value:
                type: https://agentvolumes.org/problems/authorization-failed
                title: Authorization failed
                status: 403
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notFound:
              value:
                type: https://agentvolumes.org/problems/not-found
                title: Not found
                status: 404
    Conflict:
      description: Resource conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            versionConflict:
              value:
                type: https://agentvolumes.org/problems/version-conflict
                title: Version conflict
                status: 409
            identityMismatch:
              value:
                type: https://agentvolumes.org/problems/identity-mismatch
                title: Identity mismatch
                status: 409
            idempotencyConflict:
              value:
                type: https://agentvolumes.org/problems/idempotency-conflict
                title: Idempotency conflict
                status: 409
            invalidUploadState:
              value:
                type: https://agentvolumes.org/problems/invalid-upload-state
                title: Invalid upload state
                status: 409
            inconsistentRegistryState:
              value:
                type: https://agentvolumes.org/problems/inconsistent-registry-state
                title: Inconsistent registry state
                status: 409
    Gone:
      description: Resource no longer available, such as an expired upload intent
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            uploadExpired:
              value:
                type: https://agentvolumes.org/problems/upload-expired
                title: Upload expired
                status: 410
    PayloadTooLarge:
      description: Submitted payload or declared upload size is too large
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            payloadTooLarge:
              value:
                type: https://agentvolumes.org/problems/payload-too-large
                title: Payload too large
                status: 413
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unsupportedMediaType:
              value:
                type: https://agentvolumes.org/problems/unsupported-media-type
                title: Unsupported media type
                status: 415
    TooManyRequests:
      description: Rate limited
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            rateLimited:
              value:
                type: https://agentvolumes.org/problems/rate-limited
                title: Rate limited
                status: 429
