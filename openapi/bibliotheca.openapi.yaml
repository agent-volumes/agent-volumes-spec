openapi: 3.1.1
info:
  title: Agent Volumes Bibliotheca API
  version: 0.1.0-draft.5
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
security: []
paths:
  /api/v1/search:
    get:
      summary: Search the bibliotheca catalog for matching volumes
      operationId: searchVolumes
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [agent, skill, command, tool, hook, mcp-server, lsp-server]
        - in: query
          name: runtime
          schema:
            type: string
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: publisher
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/{name}:
    post:
      summary: Create a release upload intent for an unscoped volume
      operationId: createVolumeUploadIntent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: '#/components/schemas/NameSegment'
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseUploadIntentRequest'
      responses:
        '201':
          description: Upload intent created. Upload instructions are opaque implementation data.
          content:
            application/json:
              schema:
                $ref: ../schemas/release-upload-intent.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/{name}/uploads/{uploadId}/finalize:
    post:
      summary: Finalize a release upload for an unscoped volume
      operationId: finalizeVolumeUpload
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: '#/components/schemas/NameSegment'
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Published release metadata
          content:
            application/json:
              schema:
                $ref: ../schemas/release-upload-finalize.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/@{scope}/{name}:
    post:
      summary: Create a release upload intent for a scoped volume
      operationId: createScopedVolumeUploadIntent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scope
          required: true
          schema:
            $ref: '#/components/schemas/ScopeName'
        - in: path
          name: name
          required: true
          schema:
            $ref: '#/components/schemas/NameSegment'
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseUploadIntentRequest'
      responses:
        '201':
          description: Upload intent created. Upload instructions are opaque implementation data.
          content:
            application/json:
              schema:
                $ref: ../schemas/release-upload-intent.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/volumes/@{scope}/{name}/uploads/{uploadId}/finalize:
